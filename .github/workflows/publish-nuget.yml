name: Publish C# to NuGet

on:
  push:
    tags: ['nuget-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write   # OIDC for NuGet Trusted Publishing
      contents: read

    defaults:
      run:
        working-directory: csharp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract and validate version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#nuget-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          PROJECT_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "$PROJECT_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $VERSION != Directory.Build.props <Version> $PROJECT_VERSION"
            exit 1
          fi

      - run: dotnet restore AbsLang.slnx
      - run: dotnet build AbsLang.slnx -c Release --no-restore
      - run: dotnet test AbsLang.slnx -c Release --no-build

      - name: Pack core
        run: |
          dotnet pack src/AbsLang/AbsLang.csproj -c Release --no-build \
            -o ./artifacts -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Pack satellite adapters
        shell: bash
        run: |
          for proj in \
            src/AbsLang.Adapters.Aws/AbsLang.Adapters.Aws.csproj \
            src/AbsLang.Adapters.Google/AbsLang.Adapters.Google.csproj; do
            if [ -f "$proj" ]; then
              dotnet pack "$proj" -c Release --no-build \
                -o ./artifacts -p:PackageVersion=${{ steps.version.outputs.VERSION }}
            fi
          done

      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, NOT email

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Verify the version is live
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PACKAGES="abslang abslang.adapters.aws abslang.adapters.google"
          for attempt in $(seq 1 30); do
            missing=0
            for pkg in $PACKAGES; do
              code=$(curl -s -o /dev/null -w "%{http_code}" \
                "https://api.nuget.org/v3-flatcontainer/$pkg/$VERSION/$pkg.$VERSION.nupkg?ts=$(date +%s%N)")
              if [ "$code" != "200" ]; then
                echo "⏳ $pkg $VERSION not live yet (HTTP $code)"
                missing=1
              fi
            done
            if [ "$missing" = "0" ]; then
              echo "✅ AbsLang $VERSION and satellite packages are live on NuGet"
              exit 0
            fi
            echo "attempt $attempt/30"
            sleep 15
          done
          echo "❌ Published but not visible after 7.5 minutes"
          exit 1
