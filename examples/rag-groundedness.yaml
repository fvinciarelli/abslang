session: Return policy RAG — groundedness, relevance, coherence
dataset:
  id: cases
  path: cases.jsonl
# cases.jsonl:
# {"userQuery": "What's your return policy?"}
# {"userQuery": "Can I return opened items?"}
# ... 100 filas
description: |
  User asks about return policy, agent queries the Knowledge Base.
  Evaluates groundedness, relevance, and coherence on the final answer.

behaviors:
  - id: user_asks
    actor: user
    action: says
    content: "{{cases.userQuery}}"

  - id: kb_call
    actor: assistant
    action: calls
    target: Knowledge Base

  - id: kb_result
    actor: tool
    action: responds
    target: Knowledge Base

  - id: answer
    actor: assistant
    action: informs
    evaluations:
      - type: Groundedness
        query: user_asks.says
        context: kb_result.responds
        response: self
        threshold: 0.8
      - type: Relevance
        query: user_asks.says
        response: self
        threshold: 0.7
      - type: Coherence
        response: self
        threshold: 0.7

evaluations:
  - type: sequence
    order:
      - { actor: assistant, action: calls, target: "Knowledge Base" }
      - { actor: assistant, action: informs }
