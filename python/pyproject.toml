[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abslang"
version = "0.2.2"
description = "Agent Behavior Specification — describe, run, and evaluate AI agent interactions from the command line"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["ai", "agent", "testing", "evaluation", "specification", "llm", "openapi", "behavior"]
authors = [
    {name = "Franco Vinciarelli", email = "vinciarellifranco@gmail.com"}
]
urls = {repository = "https://github.com/fvinciarelli/abslang", documentation = "https://fvinciarelli.github.io/abslang/"}
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
ai = ["aievaluator"]
azure = ["azure-ai-evaluation"]
azure-cloud = ["azure-ai-projects"]
aws = ["boto3"]

[project.scripts]
abslang = "abslang.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/abslang"]
